---
fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: check-yaml
      # Hooks able to fix small things.
      - id: trailing-whitespace
        exclude: |
          (?x)
          .patch$|
      - id: end-of-file-fixer
        exclude: |
          (?x)
          .svg$|
          .patch$|
          .po$|
          ^(
            build/flatpak/aarch64|
            build/flatpak/gst-plugin-gtk4-sources.json|
            build/flatpak/libcanberra|
            build/flatpak/patches/|
            build/flatpak/x86_64
          )
      # Hooks doing lightweight Python checks.
      - id: check-docstring-first
      - id: debug-statements
  - repo: https://github.com/asottile/reorder_python_imports.git
    rev: v3.17.0
    hooks:
      - id: reorder-python-imports
        args:
          - --py3-plus
          - --unclassifiable-application-module=tests
  - repo: https://github.com/PyCQA/pydocstyle.git
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        additional_dependencies: [snowballstemmer]
        args:
          # http://www.pydocstyle.org/en/latest/error_codes.html
          - --ignore=D1,D203,D213,D401,D406,D407,D413
  - repo: https://github.com/PyCQA/flake8.git
    rev: 7.3.0
    hooks:
      - id: flake8
        args:
          # http://flake8.pycqa.org/en/latest/user/error-codes.html
          # https://pycodestyle.readthedocs.io/en/latest/intro.html#error-codes
          - --ignore=E402,E501,E722,F401,F824,F841,W504
  - repo: https://github.com/pre-commit/mirrors-mypy.git
    rev: 'v2.3.1'
    hooks:
      - id: mypy
        files: >
          (?x)^pitivi/(
            autoaligner.py|
            clipproperties.py|
            timeline/timeline.py
          )$
        args:
          - --no-strict-optional
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: python3 -m pylint.__main__ --rcfile=pylint.rc -j1
        language: system
        types: [python]
        exclude: |
          (?x)
          ^(
            tests/validate-tests/manager.py|
            bin/pitivi.in
          )$
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - -d
          - "{extends: default, rules: {line-length: disable}}"
